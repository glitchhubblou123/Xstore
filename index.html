<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>X Store</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000"><link rel="icon" href="icon-192.png"><script src="config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);--bg:#f4f4f6;--cd:#fff;--tx:#111;--mu:#6b7280;--bd:#dcdde2;--ac:#000;--ot:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0f;--cd:#131316;--tx:#f4f4f5;--mu:#9a9aa3;--bd:#2a2a30;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0f;--cd:#131316;--tx:#f4f4f5;--mu:#9a9aa3;--bd:#2a2a30;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{--bgt:var(--bg)}
#bgl{position:fixed;inset:0;z-index:-1;background:#000}#bgl img,#bgl video{width:100%;height:100%;object-fit:cover}
*{box-sizing:border-box}body{margin:0;background:var(--bgt);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bgt);z-index:5}
.logo{width:42px;height:42px;border-radius:14px;background:#000;color:#fff;font:800 22px system-ui;display:flex;align-items:center;justify-content:center}
.brand{font-weight:700;font-size:19px;flex:1;cursor:pointer}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--mu);font-size:18px;cursor:pointer;padding:0}
.ib.pl{background:var(--ac);color:var(--ot);width:auto;border-radius:22px;padding:0 18px;font-size:22px}
main{max-width:700px;margin:0 auto;padding:16px}
@media(min-width:600px){main{max-width:900px}}
@media(min-width:900px){main{max-width:1100px}body{font-size:20px}.shots img{max-height:60vh}#m.dt{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}.dt>p{grid-column:1/-1}}
@media(max-height:500px){header{padding:6px 14px}header .logo,header .ib{width:34px;height:34px;font-size:15px}.shots img{max-height:85vh}}
:focus-visible{outline:none}
.kb :focus-visible{outline:3px solid #fff;outline-offset:3px;animation:fp 1.1s ease-in-out infinite}.kb .it:focus-visible{border-radius:22px}
@keyframes fp{0%,100%{box-shadow:0 0 0 2px #000,0 0 6px 2px rgba(255,255,255,.8)}50%{box-shadow:0 0 0 2px #000,0 0 22px 9px rgba(255,255,255,.95)}}
@media(hover:hover) and (pointer:fine){.it:hover .ic,.chip:hover{outline:2px solid #fff;animation:fp 1.1s ease-in-out infinite}}
input[type=checkbox]{width:auto;margin:0 8px 0 0;padding:0;vertical-align:middle}
.pop{position:absolute;right:10px;top:68px;width:min(330px,92vw);background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:16px;z-index:9;max-height:60vh;overflow:auto}
.pop h4{margin:0 0 10px;font-size:12px;letter-spacing:.18em;color:var(--mu)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:26px;padding:20px;margin-bottom:16px}

.btn.w{width:100%;padding:18px}.btn.o{background:transparent;color:var(--tx)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 0 14px}.chip{flex:none;padding:12px 22px;border-radius:30px;border:1px solid var(--bd);background:transparent;color:var(--mu);font:inherit;cursor:pointer}

.it b{display:block;margin-top:6px;font-size:13px;line-height:1.2;overflow-wrap:anywhere}.it small{display:block;color:var(--mu);font-size:12px;margin-top:2px;overflow-wrap:anywhere}
.feat{display:flex;gap:14px;align-items:center}.feat .ic{width:92px;flex:none}.feat div.in{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;padding:10px 0}.row span:first-child{color:var(--mu)}
.shots{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory}.shots img{flex:0 0 100%;width:100%;max-height:72vh;object-fit:contain;background:#000;border-radius:14px;scroll-snap-align:center;cursor:zoom-in}
#lb{position:fixed;inset:0;background:#000;z-index:60}#lb .lbs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%}#lb img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center}#lx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:2;background:rgba(0,0,0,.6);color:#fff;border-color:#444}
.pill{display:inline-block;padding:8px 16px;border-radius:20px;background:var(--bg);color:var(--mu);font-size:15px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;display:inline-block;margin:4px}
.admrow{display:flex;gap:12px;align-items:center}.admrow .ic{width:64px;flex:none}.admrow .in{flex:1;min-width:0}
.drop{border:1.5px dashed var(--bd);border-radius:18px;padding:12px;margin:6px 0 14px}.drop input{border:0;margin:0;padding:6px}
#sp{position:fixed;inset:0;background:#0d0d0f;color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 44px system-ui}
.spn{width:56px;height:56px;border:5px solid #222;border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite;margin-top:40px}@keyframes r{to{transform:rotate(360deg)}}#spt{display:inline-block}
.mu{color:var(--mu)}h1{font-size:34px;margin:6px 0 10px;line-height:1.1}
:root.hasbg{--cd:rgba(19,19,22,.72);--tx:#f4f4f5;--mu:#c0c0c8;--bd:#3a3a42}.hasbg header{background:rgba(0,0,0,.45)!important;backdrop-filter:blur(8px)}
</style></head><body>
<div id="sp"><span id="spt">X Store</span><div class="spn"></div></div>
<header><div class="logo" style="margin-right:-4px" onclick="go('')">X</div><div class="brand" onclick="go('')">Store</div>
<button class="ib pl" id="bm" hidden style="font-size:15px;font-weight:600">Más</button><button class="ib" id="bb">🔔</button><button class="ib" id="bs">⚙</button></header>
<div id="pp"></div><main id="m"></main>
<script>
const CATS=["Juegos","Entretenimiento","Productividad","Herramientas","Música","Búsqueda","Social","Otros"];
const $=i=>document.getElementById(i),E=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let SNAP=[];
let real=false,dev=false,cnt={},db,assets,dl,owner=false,apps=[],cat="Todas",q="",pop="",loaded=false;
const COL=["#a3e635","#22c55e","#06b6d4","#3b82f6","#8b5cf6","#ec4899","#f97316","#f43f5e"];
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
function theme(t){const r=document.documentElement;t==="system"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",t);sv("th",t);tint()}
function tint(){const r=document.documentElement,c=ld("ac");if(!c){r.style.removeProperty("--bgt");return}const t=r.getAttribute("data-theme"),dk=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches),b=dk?[13,13,15]:[244,244,246],n=parseInt(c.slice(1),16),x=[n>>16&255,n>>8&255,n&255];r.style.setProperty("--bgt","rgb("+b.map((v,i)=>Math.round(v*.7+x[i]*.3)).join(",")+")")}
theme(ld("th")||"dark");
const fm=d=>new Date(d).toLocaleDateString("es",{day:"2-digit",month:"short"}).replace(" "," ");
const fl=d=>new Date(d).toLocaleDateString("es",{day:"2-digit",month:"long",year:"numeric"});
const icon=a=>a.icon?`<img class="ic" src="${a.icon}">`:`<div class="ic">${E((a.name||"?")[0])}</div>`;
const go=h=>{location.hash=h};
const find=id=>apps.find(a=>a.id===id);
function render(){
  const h=location.hash.slice(1),m=$("m"),aj=h.startsWith("ajustes")||h==="mensajes";m.className="";$("bm").hidden=!owner||aj;$("bb").hidden=aj;$("bs").hidden=aj;if(aj)return ajustes(h);
  if(h==="publicar"||h.startsWith("editar-"))return form(h.startsWith("editar-")?find(h.slice(7)):null);
  if(h==="destacada"&&owner)return destacada();if(h==="organizar"&&owner)return organizar();if(h==="admin"&&owner){admin();return stor()}
  if(h.startsWith("app-")){const a=find(h.slice(4));if(!a)return m.innerHTML='<p class="mu">App no encontrada.</p>';detail(a);return more(a)}
  home();
}
function home(){
  const L=apps.filter(a=>(cat==="Todas"||a.cat===cat||(a.plat||[]).includes(cat)||(a.arch||[]).includes(cat))&&(a.name+" "+a.dev).toLowerCase().includes(q.toLowerCase()));
  const f=L.find(a=>(a.feat||[]).includes(cat))||[...L].sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0)||b.created-a.created)[0];
  $("m").innerHTML=`<div style="position:relative"><span style="position:absolute;left:22px;top:50%;transform:translateY(-50%);pointer-events:none">🔍</span><input id="q" aria-label="Buscar" value="${E(q)}" style="border-radius:30px;padding:18px 22px 18px 58px"></div>
  <div class="chips">${["Todas",...new Set([...CATS,...apps.map(a=>a.cat)])].map(cb).join("")}</div><div class="chips">${["PC","TV","Android"].map(cb).join("")}<span style="flex:none;width:1px;background:var(--bd);margin:6px 4px"></span>${["32 bits","64 bits"].map(cb).join("")}</div>
  ${f&&!q?`<div class="card"><div class="feat">${icon(f)}<div class="in"><small class="mu" style="letter-spacing:.2em">DESTACADA</small><b class="fit" style="display:block;margin:4px 0;font-size:20px">${E(f.name)}</b><span class="mu fit" style="display:block;font-size:14px">${[f.dev,"v"+f.ver,f.mb+" MB"].filter(Boolean).join(" · ")}</span></div></div><button class="btn w" style="margin-top:14px;padding:14px" onclick="go('app-${f.id}')">Ver →</button></div>`:""}
  <div class="row" style="align-items:baseline"><h2 style="margin:0">Todas las apps</h2><span class="mu">${L.length} resultados</span></div>
  <div class="grid">${L.map(a=>`<div class="it" onclick="go('app-${a.id}')">${icon(a)}<b>${E(a.name)}</b><small>${E(a.cat)}</small></div>`).join("")}</div>
  ${loaded&&!apps.length?'<p class="mu">Aún no hay apps publicadas.</p>':""}`;
  const i=$("q");i.oninput=()=>{q=i.value;const p=i.selectionStart;home();const n=$("q");n.focus();n.setSelectionRange(p,p)};fit();
}
function detail(a){$("m").className="dt";
  $("m").innerHTML=`<p class="mu" style="cursor:pointer" onclick="go('')">← Volver a la tienda</p>
  <div class="card"><div style="width:140px">${a.icon?`<img src="${a.icon}" data-ic="${a.id}" style="width:100%;aspect-ratio:1;object-fit:contain;display:block;cursor:zoom-in">`:icon(a)}</div><p><span class="pill">${E(a.cat)}</span> <span class="mu">&nbsp;v${E(a.ver)}</span></p>
  <h1 style="display:flex;align-items:center;justify-content:space-between;gap:10px">${E(a.name)}<span data-fv="${a.id}" tabindex="0" style="cursor:pointer;font-size:34px;${favs().includes(a.id)?"color:#facc15":""}">${favs().includes(a.id)?"★":"☆"}</span></h1><p class="mu" style="font-size:20px">${E(a.dev)}</p>
  <a class="btn w" href="${a.apk}" download>⬇ Descargar APK</a>
  
  </div>
  ${(a.shots||[]).length?`<div class="card"><h3>Capturas de pantalla</h3><div class="shots">${a.shots.map((s,i)=>`<img src="${s}" data-a="${a.id}" data-i="${i}">`).join("")}</div></div>`:""}
  ${a.news?`<div class="card"><h3>Novedades de esta versión <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;border:1px solid var(--mu);margin-left:8px;vertical-align:middle"></span></h3><p style="font-size:18px">${E(a.news)}</p></div>`:""}
  ${a.desc?`<div class="card"><h3>Acerca de esta app</h3><p style="font-size:18px">${E(a.desc)}</p></div>`:""}
  <div class="card"><h3>Detalles</h3><div class="row"><span>Desarrollador</span><span>${E(a.dev)}</span></div><div class="row"><span>Versión</span><span>${E(a.ver)}</span></div><div class="row"><span>Peso</span><span>${a.mb} MB</span></div><div class="row"><span>Categoría</span><span>${E(a.cat)}</span></div>${(a.plat||[]).length?`<div class="row"><span>Plataforma</span><span>${a.plat.join(", ")}</span></div>`:""}${(a.arch||[]).length?`<div class="row"><span>Arquitectura</span><span>${a.arch.join(", ")}</span></div>`:""}<div class="row"><span>Publicada</span><span>${fl(a.created)}</span></div>
  ${owner?`<button class="btn o w" onclick="go('editar-${a.id}')">✏ Administrar publicación</button>`:""}</div>
  `;
}
function admin(){
  $("m").innerHTML=`<div class="card"><b>Almacenamiento</b><p id="stg" class="mu">Calculando…</p><button class="btn o w" data-cl="1">Limpiar archivos sin usar</button></div><div class="row" style="align-items:baseline"><h2 style="margin:0">Apps publicadas</h2><span class="mu">${apps.length} en total</span></div>
  ${apps.map(a=>`<div class="card admrow">${icon(a)}<div class="in"><b>${E(a.name)}</b><br><span class="mu">${E(a.cat)} · v${E(a.ver)} · ${a.mb} MB</span></div><button class="ib" onclick="go('editar-${a.id}')">✏</button><button class="ib" data-x="${a.id}">🗑</button></div>`).join("")}`;
}
function form(a){
  if(!owner)return $("m").innerHTML='<p class="mu">Solo el desarrollador puede publicar.</p>';
  a=a||{};
  $("m").innerHTML=`<h1>${a.id?"Editar app":"Publicar en X Store"}</h1><p class="mu">Sube el APK, su icono y los datos. Aparece al instante y cualquiera puede descargarla.</p>
  <div class="card"><h2 style="margin-top:0">${a.id?E(a.name):"Nueva app"}</h2><p class="mu">Los campos marcados con * son obligatorios.</p>
  <label>Nombre *</label><input id="fn" value="${E(a.name)}" placeholder="Mi app increíble">
  <label>Desarrollador</label><input id="fd" value="${E(a.dev)}" placeholder="Estudio o equipo">
  <label>Categoría</label><select id="fc">${CATS.map(c=>`<option ${c===a.cat||(c==="Otros"&&a.cat&&!CATS.includes(a.cat))?"selected":""}>${c}</option>`).join("")}</select><input id="fo" placeholder="Escribe la categoría" value="${E(a.cat&&!CATS.includes(a.cat)?a.cat:"")}" ${a.cat&&!CATS.includes(a.cat)?"":"hidden"}>
  <label>Plataforma</label><div class="chips" style="flex-wrap:wrap;margin:6px 0 14px">${["PC","TV","Android"].map(v=>`<label class="chip" style="text-transform:none;letter-spacing:0;font-size:16px"><input type="checkbox" class="pf" value="${v}" ${(a.plat||[]).includes(v)?"checked":""}>${v}</label>`).join("")}</div><label>Arquitectura</label><div class="chips" style="flex-wrap:wrap;margin:6px 0 14px">${["32 bits","64 bits"].map(v=>`<label class="chip" style="text-transform:none;letter-spacing:0;font-size:16px"><input type="checkbox" class="ar" value="${v}" ${(a.arch||[]).includes(v)?"checked":""}>${v}</label>`).join("")}</div><label>Versión</label><input id="fv" value="${E(a.ver||"1.0.0")}">
  <label>Peso (MB)</label><input id="fm" value="${E(a.mb||"")}" placeholder="Se calcula solo">
  <label>Novedades</label><textarea id="fw" rows="3" placeholder="Qué se actualizó en esta versión...">${E(a.news)}</textarea>
  <label>Descripción</label><textarea id="fx" rows="4" placeholder="Cuenta qué hace tu app y por qué vale la pena instalarla.">${E(a.desc)}</textarea>
  <label>Icono (PNG o JPG, cuadrado)</label><div class="drop"><input id="fi" type="file" accept="image/*"></div>
  <label>Archivo APK ${a.id?"(opcional: reemplaza)":"*"}</label><div class="drop"><input id="fa" type="file"></div>
  <label>Capturas (hasta 6)</label><div class="drop"><input id="fs" type="file" accept="image/*" multiple></div>
  <button class="btn w" id="fp">${a.id?"Guardar cambios":"Publicar app"}</button><p id="fe" class="mu"></p></div>`;
  $("fp").onclick=()=>save(a);$("fc").onchange=()=>{$("fo").hidden=$("fc").value!=="Otros"};
}
async function up(f){const r=await assets.upload(f);UP.push(r.id);return r.id}
let DEL=[],UP=[],ti=0;const TY=[["text/plain",".txt"],["application/pdf",".pdf"],["video/mp4",".mp4"],["font/ttf",".ttf"]];
async function upRaw(b,name){let last;for(;ti<TY.length;ti++){try{const r=await assets.upload(new File([b],name+TY[ti][1],{type:TY[ti][0]}));UP.push(r.id);return r.id}catch(x){last=x;if(x&&x.code==="quota_or_state")break}}ti=0;throw last}
async function upApk(f,e){const S=15*1048576,ids=[],n=Math.ceil(f.size/S);for(let i=0;i<n;i++){e.textContent=`Subiendo parte ${i+1} de ${n}…`;ids.push(await upRaw(f.slice(i*S,(i+1)*S),f.name+".p"+i))}return ids}
async function save(a){
  const n=$("fn").value.trim(),fa=$("fa").files[0],fi=$("fi").files[0],fs=[...$("fs").files].slice(0,6),e=$("fe");
  if(!n||(!a.id&&!fa)){e.textContent="Falta el nombre o el APK.";return}
  if(!assets||!db){e.textContent="La subida no está disponible: abre el enlace con tu cuenta de dueño.";return}
  e.textContent="Subiendo… (puede tardar con APKs grandes)";$("fp").disabled=true;UP=[];DEL=[];
  try{
    const d={...a};delete d.id;
    if(fa){const olds=a.parts||(a.blob?[a.blob]:[]);d.parts=await upApk(fa,e);d.blob=d.parts[0];d.file=fa.name;d.mb=($("fm").value.trim()||(fa.size/1048576).toFixed(1));DEL=[...olds];}
    else d.mb=$("fm").value.trim()||a.mb;
    if(fi){if(a.icon)try{await assets.delete(a.icon)}catch(x){}d.icon=await up(fi)}
    if(fs.length){for(const s of a.shots||[])try{await assets.delete(s)}catch(x){}d.shots=[];for(const s of fs)d.shots.push(await up(s))}
    Object.assign(d,{name:n,dev:$("fd").value.trim(),cat:($("fc").value==="Otros"&&$("fo").value.trim())||$("fc").value,plat:[...document.querySelectorAll(".pf:checked")].map(x=>x.value),arch:[...document.querySelectorAll(".ar:checked")].map(x=>x.value),ver:$("fv").value.trim(),news:$("fw").value.trim(),desc:$("fx").value.trim(),created:a.created||Date.now(),updated:Date.now()});
    if(!a.id&&d.order===undefined)d.order=Math.min(0,...apps.map(x=>x.order??0))-1;await db.collection("apps").doc(a.id||d.blob).set(d);for(const o of DEL)try{await assets.delete(o)}catch(y){}DEL=[];UP=[];go("");
  }catch(x){for(const i of UP)try{await assets.delete(i)}catch(y){}UP=[];e.textContent="Error: "+([x.code,x.message].filter(Boolean).join(" – ")||"no se pudo guardar");$("fp").disabled=false}
}
function lb(a,i){if(!a)return;const d=document.createElement("div");d.id="lb";d.innerHTML=`<button class="ib" id="lx">✕</button><div class="lbs">${a.shots.map(s=>`<img src="${s}">`).join("")}</div>`;document.body.appendChild(d);const s=d.querySelector(".lbs");s.scrollLeft=i*s.clientWidth;d.querySelector("#lx").onclick=()=>d.remove()}
function fit(){document.querySelectorAll(".it b,.it small,.fit").forEach(b=>{b.style.whiteSpace="nowrap";b.style.overflowWrap="normal";b.style.fontSize="";let s=parseFloat(getComputedStyle(b).fontSize);while(b.scrollWidth>b.clientWidth&&s>9){s--;b.style.fontSize=s+"px"}if(b.scrollWidth>b.clientWidth){b.style.whiteSpace="normal";b.style.overflowWrap="anywhere"}})}
const DH="-";
async function login(mode){const am=$("am"),u=($("lu").value||"").trim().toLowerCase(),p=$("lp").value;if(!u||!p){am.textContent="Escribe usuario y contraseña.";return}try{const h=[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(u+":"+p)))].map(x=>x.toString(16).padStart(2,"0")).join("");let ac={};try{ac=JSON.parse(ld("accts")||"{}")}catch(e){}
